name: Build ChatID APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ChatID project
        run: |
          mkdir project
          unzip -q chatid.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          PROP="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          URL="https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
          echo "Gradle URL: $URL"
          curl -L "$URL" -o gradle.zip
          unzip -q gradle.zip
          echo "GRADLE_HOME=$(find . -maxdepth 1 -type d -name 'gradle-*' | head -1)" >> $GITHUB_ENV
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          
          "$GITHUB_WORKSPACE/$GRADLE_HOME/bin/gradle" assembleDebug --no-daemon

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatID-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
