name: Build ChatID APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ChatID project
        run: |
          mkdir project
          unzip -q chatid.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found in ChatID project"
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatID-APK
          path: project/**/build/outputs/apk/**/*.apk
